app_version: 1.0.0
name: kafka-producer-with-certificate
description: Kafka Producer with SSL/TLS certificate support via text input
contact_info:
  name: Gradient Cyber
  email: support@gradientcyber.com
tags:
  - kafka
  - messaging
  - ssl
categories:
  - messaging
authentication:
  required: false
actions:
  - name: send_message_to_kafka_topic
    description: Send a message to a Kafka topic with optional SSL/TLS security
    parameters:
      - name: bootstrap_servers
        description: "Kafka broker address(es). Example: broker.example.com:9093"
        multiline: false
        required: true
        example: "localhost:9092"
        schema:
          type: string

      - name: topic
        description: "Kafka topic name to send the message to"
        multiline: false
        required: true
        example: "my-topic"
        schema:
          type: string

      - name: message
        description: "Message payload to send (plain string or JSON)"
        multiline: true
        required: true
        example: '{"event": "test", "value": 123}'
        schema:
          type: string

      - name: security_protocol
        description: "Security protocol to use for Kafka connection"
        multiline: false
        required: false
        example: "PLAINTEXT"
        options:
          - PLAINTEXT
          - SSL
          - SASL_PLAINTEXT
          - SASL_SSL
        schema:
          type: string

      - name: ssl_ca_content
        description: "CA certificate content in PEM format (paste full certificate text)"
        multiline: true
        required: false
        example: |
          -----BEGIN CERTIFICATE-----
          MIIDXTCCAkWgAwIBAgIJA...
          -----END CERTIFICATE-----
        schema:
          type: string

      - name: ssl_certificate_content
        description: "Client certificate content in PEM format (paste full certificate text)"
        multiline: true
        required: false
        example: |
          -----BEGIN CERTIFICATE-----
          MIIDXTCCAkWgAwIBAgIJA...
          -----END CERTIFICATE-----
        schema:
          type: string

      - name: ssl_key_content
        description: "Client private key content in PEM format (paste full key text)"
        multiline: true
        required: false
        example: |
          -----BEGIN PRIVATE KEY-----
          MIIEvQIBADANBgkqhkiG9...
          -----END PRIVATE KEY-----
        schema:
          type: string

      - name: ssl_key_password
        description: "Password for encrypted private key (leave blank if key is not encrypted)"
        multiline: false
        required: false
        example: ""
        schema:
          type: string

      - name: acks
        description: "Producer acknowledgment level: 0 (none), 1 (leader), all (full ISR)"
        multiline: false
        required: false
        example: "all"
        options:
          - "all"
          - "1"
          - "0"
        schema:
          type: string

      - name: retries
        description: "Number of times to retry sending on failure"
        multiline: false
        required: false
        example: "3"
        schema:
          type: string
large_image: ""
